# CI for narration-mcp (plan.md WP03 and section 1.4).
#
# Jobs:
#   lint     ruff check and ruff format --check
#   types    basedpyright (pyright with its runtime bundled)
#   tests    the default pytest suite (no model, gpu, evidence or slow tests) on Windows and Linux
#   tracked  tools/check_tracked.py: no local paths and no audio, weights or databases, in the files
#            and in the commit messages being pushed or proposed
#   schemas  the published tool schemas contain no "$ref", and every outputSchema is an object
#   worker-qwen3tts  the Qwen worker's default tests on Windows and Linux, and basedpyright on its code,
#            in a venv without the model packages (torch, qwen-tts, transformers)
#
# Nothing here needs a GPU, a model, the bakeoff or a secret.
#
# Every third-party action is pinned to the full commit SHA of a release, named in the comment. To
# update one, resolve the new release's commit with `gh api repos/<owner>/<repo>/commits/<tag> --jq .sha`.
#
# Python and packages. actions/setup-python installs CPython 3.12, and uv is told to use that interpreter
# and never to download one (UV_PYTHON, UV_PYTHON_DOWNLOADS). A contributor works the same way: an
# installed 3.12, never a uv-managed one (AGENTS.md section 2), and a missing interpreter fails loudly
# instead of being fetched. The packages come from the committed uv.lock: `uv sync --locked` fails if the
# lock is stale, and UV_LOCKED makes every other uv command refuse to re-lock too. uv itself is pinned
# to the version that wrote the lock; setup-uv verifies its checksum.
#
# No PYTHONUTF8 or PYTHONIOENCODING: the Windows job should see the default encodings a user's
# machine has, so code that forgets encoding="utf-8" fails here and not there.

name: CI

on:
  push:
    branches: [main, "wp/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # One run per pull request or branch: a newer push cancels the run it supersedes. Runs on main are
  # never cancelled, so every commit on main gets a result.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: "0.10.10"
  UV_PYTHON: "3.12"
  UV_PYTHON_DOWNLOADS: never
  UV_LOCKED: "1"

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install from the lock
        run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github
      - name: ruff format --check
        run: uv run ruff format --check --diff

  types:
    name: types (basedpyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install from the lock
        run: uv sync --locked
      - name: basedpyright
        run: uv run basedpyright

  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install from the lock
        run: uv sync --locked
      - name: Default test suite
        # pyproject.toml's addopts already deselect the model, gpu, evidence and slow markers.
        run: uv run pytest

  tracked:
    name: tracked (no local paths, no binaries)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the commit-message check needs the history
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Tracked files
        # On a pull request this is the merge result, which is what would land on main.
        run: python tools/check_tracked.py
      - name: Commit messages
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A pull request: the commits it proposes. A push: the commits it added. A push that created
          # the branch (BEFORE is all zeros) or rewrote it (BEFORE is gone): every commit not on main.
          if [ "$EVENT" = pull_request ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          else
            range="origin/main..$AFTER"
          fi
          # Only the count is printed: echoing commit text could smuggle workflow commands into the log.
          echo "Checking the messages of $(git rev-list --count "$range") commit(s) in $range"
          python tools/check_tracked.py --commits "$range"

  schemas:
    name: schemas (no $ref, object outputs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install from the lock
        run: uv sync --locked
      - name: Schema checks
        # The checks are WP01's tests of narration.contracts.schemas, under tests/contracts. Until that
        # folder exists this step passes with a notice. Once it exists the checks run for real, and they
        # must select at least one test: if nothing matches "schema", pytest exits 5 and the job fails.
        run: |
          if [ ! -d tests/contracts ]; then
            echo "::notice title=schemas::tests/contracts does not exist yet (plan.md WP01), so there are no schema checks to run."
            exit 0
          fi
          uv run pytest -m "not model and not gpu and not evidence and not slow" -k schema tests/contracts

  worker-qwen3tts:
    name: worker qwen3tts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            workers/qwen3tts/uv.lock
      - name: Install from the worker's lock, without the model packages
        # The worker imports torch, qwen-tts and transformers only where a model loads, so its default tests
        # and its code need only numpy, soundfile and pytest. Those come at the versions workers/qwen3tts/uv.lock
        # pins: the lock is exported as constraints (UV_LOCKED makes the export fail if the lock is stale).
        # The two worker packages are installed without their dependencies; the qwen3 role's entry point
        # needs the worker installed, not just on the path.
        run: |
          uv export --project workers/qwen3tts --no-hashes --no-emit-project --no-emit-package narration-worker \
            --quiet -o "$RUNNER_TEMP/qwen3tts-constraints.txt"
          uv venv workers/qwen3tts/.venv
          uv pip install --python workers/qwen3tts/.venv -c "$RUNNER_TEMP/qwen3tts-constraints.txt" \
            numpy soundfile pytest
          uv pip install --python workers/qwen3tts/.venv --no-deps -e workers/common -e workers/qwen3tts
      - name: Default tests
        # The worker's pyproject.toml deselects the model, gpu, evidence and slow markers.
        working-directory: workers/qwen3tts
        run: |
          if [ "$RUNNER_OS" = Windows ]; then py=.venv/Scripts/python.exe; else py=.venv/bin/python; fi
          "$py" -m pytest
      - name: Install the server's dev tools
        if: runner.os == 'Linux'
        run: uv sync --locked
      - name: basedpyright
        # The server's basedpyright and settings, resolving imports in the worker's venv.
        if: runner.os == 'Linux'
        run: uv run basedpyright --pythonpath workers/qwen3tts/.venv/bin/python workers/qwen3tts
